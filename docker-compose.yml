services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: busbooking-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-bus_booking}"

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - busbooking-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: busbooking-backend
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-5000}:5000"

    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bususer
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: bus_booking
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - busbooking-network

  # User Service
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile

    container_name: busbooking-user-service
    restart: unless-stopped

    ports:
      - "${USER_SERVICE_PORT:-3001}:3001"

    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bususer
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: bus_booking

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - busbooking-network

  # Bus Service
  bus-service:
    build:
      context: ./services/bus-service
      dockerfile: Dockerfile

    container_name: busbooking-bus-service
    restart: unless-stopped

    ports:
      - "${BUS_SERVICE_PORT:-3002}:3002"

    environment:
      PORT: 3002
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bususer
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: bus_booking

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - busbooking-network

  # Booking Service
  booking-service:
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile

    container_name: busbooking-booking-service
    restart: unless-stopped

    ports:
      - "${BOOKING_SERVICE_PORT:-3003}:3003"

    environment:
      PORT: 3003
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: bususer
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      DB_NAME: bus_booking

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - busbooking-network

# Persistent MySQL Storage
volumes:
  mysql_data:

# Docker Network
networks:
  busbooking-network:
    driver: bridge